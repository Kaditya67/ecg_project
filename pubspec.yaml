name: ecg_app
description: "A Flutter application for ECG monitoring."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.3.0               # For REST API calls to Django
  flutter_blue_plus: ^1.0.0   # For Bluetooth ECG sensor connectivity
  provider: ^6.0.5            # For state management
  fl_chart: ^0.70.2           # To plot ECG graphs
  shared_preferences: ^2.2.2  # To store local data if needed
  google_fonts: ^6.2.1
  glassmorphism_ui: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
